<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 510">
  <style>
    text { font-family: 'Segoe UI', Arial, sans-serif; }
    .title { font-size: 18px; font-weight: bold; fill: #1a1a1a; }
    .subtitle { font-size: 13px; fill: #555; }
    .section-title { font-size: 15px; font-weight: bold; fill: #333; }
    .bucket-idx { font-size: 12px; font-weight: bold; fill: #333; font-family: 'Consolas', monospace; }
    .value { font-size: 11px; font-weight: bold; fill: #fff; }
    .value-lg { font-size: 12px; font-weight: bold; fill: #fff; }
    .empty-label { font-size: 11px; fill: #999; font-style: italic; }
    .label { font-size: 12px; fill: #333; }
    .label-bold { font-size: 12px; font-weight: bold; fill: #333; }
    .code { font-size: 11px; fill: #2c3e50; font-family: 'Consolas', monospace; }
    .note { font-size: 11px; fill: #777; font-style: italic; }
    .alert { font-size: 12px; font-weight: bold; fill: #e74c3c; }
    .success { font-size: 12px; font-weight: bold; fill: #27ae60; }
    .collision { font-size: 11px; font-weight: bold; fill: #e74c3c; }
    .resolved { font-size: 11px; font-weight: bold; fill: #27ae60; }
    .resize-label { font-size: 15px; font-weight: bold; fill: #fff; }
    .dots { font-size: 13px; fill: #999; font-weight: bold; }
    .annot { font-size: 10px; fill: #777; font-style: italic; }
  </style>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#e74c3c"/>
    </marker>
    <marker id="arr-g" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#bdc3c7"/>
    </marker>
    <marker id="arr-grn" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="540" y="26" text-anchor="middle" class="title">Resize — Load Factor Exceeds MAX_LOAD_FACTOR</text>
  <text x="540" y="44" text-anchor="middle" class="subtitle">Every entry is rehashed with the new capacity: hash(key) % 17 gives different indices than % 7</text>

  <!-- ==================== BEFORE (left side) ==================== -->
  <text x="30" y="72" class="section-title">BEFORE</text>
  <text x="30" y="88" class="code">capacity = 7 &#160; size = 7</text>
  <text x="30" y="104" class="alert">load_factor = 7/7 = 1.0 &gt; MAX!</text>

  <!-- Bucket [0] — empty -->
  <text x="22" y="132" text-anchor="middle" class="bucket-idx">[0]</text>
  <rect x="38" y="117" width="65" height="25" rx="3" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1.5"/>
  <text x="70" y="134" text-anchor="middle" class="empty-label">nullptr</text>

  <!-- Bucket [1] — empty -->
  <text x="22" y="163" text-anchor="middle" class="bucket-idx">[1]</text>
  <rect x="38" y="148" width="65" height="25" rx="3" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1.5"/>
  <text x="70" y="165" text-anchor="middle" class="empty-label">nullptr</text>

  <!-- Bucket [2] — Charlie -->
  <text x="22" y="194" text-anchor="middle" class="bucket-idx">[2]</text>
  <rect x="38" y="179" width="65" height="25" rx="3" fill="#7f8c8d" stroke="#636e72" stroke-width="1.5"/>
  <text x="70" y="196" text-anchor="middle" class="value">&#x2192;</text>
  <line x1="103" y1="191" x2="138" y2="191" stroke="#e74c3c" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="141" y="179" width="60" height="25" rx="3" fill="#3498db" stroke="#2980b9" stroke-width="1.5"/>
  <rect x="201" y="179" width="28" height="25" rx="3" fill="#2ecc71" stroke="#27ae60" stroke-width="1.5"/>
  <text x="171" y="196" text-anchor="middle" class="value">Charlie</text>
  <text x="215" y="196" text-anchor="middle" class="value-lg">91</text>

  <!-- Bucket [3] — Bob -->
  <text x="22" y="225" text-anchor="middle" class="bucket-idx">[3]</text>
  <rect x="38" y="210" width="65" height="25" rx="3" fill="#7f8c8d" stroke="#636e72" stroke-width="1.5"/>
  <text x="70" y="227" text-anchor="middle" class="value">&#x2192;</text>
  <line x1="103" y1="222" x2="138" y2="222" stroke="#e74c3c" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="141" y="210" width="60" height="25" rx="3" fill="#3498db" stroke="#2980b9" stroke-width="1.5"/>
  <rect x="201" y="210" width="28" height="25" rx="3" fill="#2ecc71" stroke="#27ae60" stroke-width="1.5"/>
  <text x="171" y="227" text-anchor="middle" class="value">Bob</text>
  <text x="215" y="227" text-anchor="middle" class="value-lg">82</text>

  <!-- Bucket [4] — Diana → Alice (COLLISION) -->
  <text x="22" y="256" text-anchor="middle" class="bucket-idx">[4]</text>
  <rect x="38" y="241" width="65" height="25" rx="3" fill="#7f8c8d" stroke="#e74c3c" stroke-width="2.5"/>
  <text x="70" y="258" text-anchor="middle" class="value">&#x2192;</text>
  <line x1="103" y1="253" x2="138" y2="253" stroke="#e74c3c" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- Diana -->
  <rect x="141" y="241" width="60" height="25" rx="3" fill="#3498db" stroke="#e74c3c" stroke-width="2"/>
  <rect x="201" y="241" width="28" height="25" rx="3" fill="#2ecc71" stroke="#27ae60" stroke-width="1.5"/>
  <text x="171" y="258" text-anchor="middle" class="value">Diana</text>
  <text x="215" y="258" text-anchor="middle" class="value-lg">78</text>
  <line x1="229" y1="253" x2="258" y2="253" stroke="#e74c3c" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- Alice -->
  <rect x="261" y="241" width="60" height="25" rx="3" fill="#3498db" stroke="#e74c3c" stroke-width="2"/>
  <rect x="321" y="241" width="28" height="25" rx="3" fill="#2ecc71" stroke="#27ae60" stroke-width="1.5"/>
  <text x="291" y="258" text-anchor="middle" class="value">Alice</text>
  <text x="335" y="258" text-anchor="middle" class="value-lg">95</text>
  <text x="360" y="258" class="collision">collision!</text>

  <!-- Bucket [5] — Eve -->
  <text x="22" y="287" text-anchor="middle" class="bucket-idx">[5]</text>
  <rect x="38" y="272" width="65" height="25" rx="3" fill="#7f8c8d" stroke="#636e72" stroke-width="1.5"/>
  <text x="70" y="289" text-anchor="middle" class="value">&#x2192;</text>
  <line x1="103" y1="284" x2="138" y2="284" stroke="#e74c3c" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="141" y="272" width="60" height="25" rx="3" fill="#3498db" stroke="#2980b9" stroke-width="1.5"/>
  <rect x="201" y="272" width="28" height="25" rx="3" fill="#2ecc71" stroke="#27ae60" stroke-width="1.5"/>
  <text x="171" y="289" text-anchor="middle" class="value">Eve</text>
  <text x="215" y="289" text-anchor="middle" class="value-lg">88</text>

  <!-- Bucket [6] — Grace → Frank (COLLISION) -->
  <text x="22" y="318" text-anchor="middle" class="bucket-idx">[6]</text>
  <rect x="38" y="303" width="65" height="25" rx="3" fill="#7f8c8d" stroke="#e74c3c" stroke-width="2.5"/>
  <text x="70" y="320" text-anchor="middle" class="value">&#x2192;</text>
  <line x1="103" y1="315" x2="138" y2="315" stroke="#e74c3c" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- Grace -->
  <rect x="141" y="303" width="60" height="25" rx="3" fill="#3498db" stroke="#e74c3c" stroke-width="2"/>
  <rect x="201" y="303" width="28" height="25" rx="3" fill="#2ecc71" stroke="#27ae60" stroke-width="1.5"/>
  <text x="171" y="320" text-anchor="middle" class="value">Grace</text>
  <text x="215" y="320" text-anchor="middle" class="value-lg">86</text>
  <line x1="229" y1="315" x2="258" y2="315" stroke="#e74c3c" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- Frank -->
  <rect x="261" y="303" width="60" height="25" rx="3" fill="#3498db" stroke="#e74c3c" stroke-width="2"/>
  <rect x="321" y="303" width="28" height="25" rx="3" fill="#2ecc71" stroke="#27ae60" stroke-width="1.5"/>
  <text x="291" y="320" text-anchor="middle" class="value">Frank</text>
  <text x="335" y="320" text-anchor="middle" class="value-lg">73</text>
  <text x="360" y="320" class="collision">collision!</text>

  <!-- ==================== CENTER ARROW ==================== -->
  <rect x="440" y="200" width="95" height="44" rx="5" fill="#2c3e50"/>
  <polygon points="535,190 570,222 535,254" fill="#2c3e50"/>
  <text x="488" y="227" text-anchor="middle" class="resize-label">resize()</text>

  <text x="505" y="270" text-anchor="middle" class="code">next_prime(2 &#xd7; 7)</text>
  <text x="505" y="285" text-anchor="middle" class="code">= next_prime(14)</text>
  <text x="505" y="302" text-anchor="middle" class="label-bold">= 17</text>

  <!-- ==================== AFTER (right side) ==================== -->
  <text x="610" y="72" class="section-title">AFTER</text>
  <text x="610" y="88" class="code">capacity = 17 &#160; size = 7</text>
  <text x="610" y="104" class="success">load_factor = 7/17 &#x2248; 0.41</text>

  <!-- [1] Grace -->
  <text x="612" y="132" text-anchor="middle" class="bucket-idx">[1]</text>
  <rect x="626" y="117" width="50" height="25" rx="3" fill="#7f8c8d" stroke="#27ae60" stroke-width="2"/>
  <text x="651" y="134" text-anchor="middle" class="value">&#x2192;</text>
  <line x1="676" y1="129" x2="706" y2="129" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-grn)"/>
  <rect x="709" y="117" width="60" height="25" rx="3" fill="#3498db" stroke="#27ae60" stroke-width="2"/>
  <rect x="769" y="117" width="28" height="25" rx="3" fill="#2ecc71" stroke="#27ae60" stroke-width="1.5"/>
  <text x="739" y="134" text-anchor="middle" class="value">Grace</text>
  <text x="783" y="134" text-anchor="middle" class="value-lg">86</text>
  <text x="806" y="134" class="resolved">was [6]</text>

  <!-- [2] Bob -->
  <text x="612" y="163" text-anchor="middle" class="bucket-idx">[2]</text>
  <rect x="626" y="148" width="50" height="25" rx="3" fill="#7f8c8d" stroke="#636e72" stroke-width="1.5"/>
  <text x="651" y="165" text-anchor="middle" class="value">&#x2192;</text>
  <line x1="676" y1="160" x2="706" y2="160" stroke="#e74c3c" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="709" y="148" width="60" height="25" rx="3" fill="#3498db" stroke="#2980b9" stroke-width="1.5"/>
  <rect x="769" y="148" width="28" height="25" rx="3" fill="#2ecc71" stroke="#27ae60" stroke-width="1.5"/>
  <text x="739" y="165" text-anchor="middle" class="value">Bob</text>
  <text x="783" y="165" text-anchor="middle" class="value-lg">82</text>

  <!-- [4] Alice → Charlie (NEW collision!) -->
  <text x="612" y="200" text-anchor="middle" class="bucket-idx">[4]</text>
  <rect x="626" y="185" width="50" height="25" rx="3" fill="#7f8c8d" stroke="#e74c3c" stroke-width="2.5"/>
  <text x="651" y="202" text-anchor="middle" class="value">&#x2192;</text>
  <line x1="676" y1="197" x2="706" y2="197" stroke="#e74c3c" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- Alice -->
  <rect x="709" y="185" width="60" height="25" rx="3" fill="#3498db" stroke="#e74c3c" stroke-width="2"/>
  <rect x="769" y="185" width="28" height="25" rx="3" fill="#2ecc71" stroke="#27ae60" stroke-width="1.5"/>
  <text x="739" y="202" text-anchor="middle" class="value">Alice</text>
  <text x="783" y="202" text-anchor="middle" class="value-lg">95</text>
  <line x1="797" y1="197" x2="822" y2="197" stroke="#e74c3c" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- Charlie -->
  <rect x="825" y="185" width="60" height="25" rx="3" fill="#3498db" stroke="#e74c3c" stroke-width="2"/>
  <rect x="885" y="185" width="28" height="25" rx="3" fill="#2ecc71" stroke="#27ae60" stroke-width="1.5"/>
  <text x="855" y="202" text-anchor="middle" class="value">Charlie</text>
  <text x="899" y="202" text-anchor="middle" class="value-lg">91</text>
  <text x="922" y="202" class="collision">new collision!</text>

  <!-- ··· -->
  <text x="651" y="228" text-anchor="middle" class="dots">&#xb7;&#xb7;&#xb7;</text>

  <!-- [11] Eve -->
  <text x="616" y="252" text-anchor="middle" class="bucket-idx">[11]</text>
  <rect x="626" y="237" width="50" height="25" rx="3" fill="#7f8c8d" stroke="#636e72" stroke-width="1.5"/>
  <text x="651" y="254" text-anchor="middle" class="value">&#x2192;</text>
  <line x1="676" y1="249" x2="706" y2="249" stroke="#e74c3c" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="709" y="237" width="60" height="25" rx="3" fill="#3498db" stroke="#2980b9" stroke-width="1.5"/>
  <rect x="769" y="237" width="28" height="25" rx="3" fill="#2ecc71" stroke="#27ae60" stroke-width="1.5"/>
  <text x="739" y="254" text-anchor="middle" class="value">Eve</text>
  <text x="783" y="254" text-anchor="middle" class="value-lg">88</text>

  <!-- [12] Frank -->
  <text x="616" y="283" text-anchor="middle" class="bucket-idx">[12]</text>
  <rect x="626" y="268" width="50" height="25" rx="3" fill="#7f8c8d" stroke="#27ae60" stroke-width="2"/>
  <text x="651" y="285" text-anchor="middle" class="value">&#x2192;</text>
  <line x1="676" y1="280" x2="706" y2="280" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-grn)"/>
  <rect x="709" y="268" width="60" height="25" rx="3" fill="#3498db" stroke="#27ae60" stroke-width="2"/>
  <rect x="769" y="268" width="28" height="25" rx="3" fill="#2ecc71" stroke="#27ae60" stroke-width="1.5"/>
  <text x="739" y="285" text-anchor="middle" class="value">Frank</text>
  <text x="783" y="285" text-anchor="middle" class="value-lg">73</text>
  <text x="806" y="285" class="resolved">was [6]</text>

  <!-- ··· -->
  <text x="651" y="311" text-anchor="middle" class="dots">&#xb7;&#xb7;&#xb7;</text>

  <!-- [15] Diana -->
  <text x="616" y="335" text-anchor="middle" class="bucket-idx">[15]</text>
  <rect x="626" y="320" width="50" height="25" rx="3" fill="#7f8c8d" stroke="#27ae60" stroke-width="2"/>
  <text x="651" y="337" text-anchor="middle" class="value">&#x2192;</text>
  <line x1="676" y1="332" x2="706" y2="332" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-grn)"/>
  <rect x="709" y="320" width="60" height="25" rx="3" fill="#3498db" stroke="#27ae60" stroke-width="2"/>
  <rect x="769" y="320" width="28" height="25" rx="3" fill="#2ecc71" stroke="#27ae60" stroke-width="1.5"/>
  <text x="739" y="337" text-anchor="middle" class="value">Diana</text>
  <text x="783" y="337" text-anchor="middle" class="value-lg">78</text>
  <text x="806" y="337" class="resolved">was [4]</text>

  <text x="626" y="367" class="annot">11 of 17 buckets empty (not shown)</text>

  <!-- ==================== Bottom callout ==================== -->
  <rect x="25" y="395" width="1030" height="100" rx="8" fill="#f4f6f7" stroke="#bdc3c7" stroke-width="1.5"/>

  <text x="540" y="418" text-anchor="middle" class="label-bold">What happened?</text>

  <text x="45" y="440" class="resolved">RESOLVED:</text>
  <text x="118" y="440" class="label">Diana &amp; Alice were both at [4] (% 7 = 4) &#x2014; now Diana is at [15], Alice at [4] (% 17)</text>

  <text x="45" y="458" class="resolved">RESOLVED:</text>
  <text x="118" y="458" class="label">Grace &amp; Frank were both at [6] (% 7 = 6) &#x2014; now Grace is at [1], Frank at [12] (% 17)</text>

  <text x="45" y="476" class="collision">NEW:</text>
  <text x="80" y="476" class="label">Alice &amp; Charlie now share [4] &#x2014; resize doesn&#x2019;t guarantee zero collisions, it reduces the average</text>

  <text x="540" y="492" text-anchor="middle" class="note">Load factor dropped from 1.0 to 0.41 &#x2014; most buckets are empty, so lookups are fast again</text>
</svg>
