<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380">
  <style>
    text { font-family: 'Segoe UI', Arial, sans-serif; }
    .title { font-size: 18px; font-weight: bold; fill: #1a1a1a; }
    .subtitle { font-size: 13px; fill: #555; }
    .step-label { font-size: 14px; font-weight: bold; fill: #333; }
    .value { font-size: 15px; font-weight: bold; fill: #fff; }
    .value-sm { font-size: 12px; font-weight: bold; fill: #fff; }
    .field-label { font-size: 11px; font-weight: bold; fill: #fff; }
    .label { font-size: 13px; fill: #333; }
    .label-bold { font-size: 13px; font-weight: bold; }
    .code { font-size: 12px; fill: #2c3e50; font-family: 'Consolas', monospace; }
    .note { font-size: 11px; fill: #777; font-style: italic; }
  </style>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e74c3c"/>
    </marker>
  </defs>

  <text x="400" y="28" text-anchor="middle" class="title">ChainNode Structure</text>
  <text x="400" y="48" text-anchor="middle" class="subtitle">Each node in a hash table chain stores a key-value pair and a next pointer</text>

  <!-- ==================== Struct Declaration ==================== -->
  <text x="30" y="85" class="step-label">Struct declaration:</text>
  <text x="30" y="105" class="code">struct ChainNode { std::string key; int value; ChainNode* next; };</text>

  <!-- ==================== Single ChainNode Diagram ==================== -->
  <text x="30" y="148" class="step-label">ChainNode in memory:</text>

  <!-- key field (blue) -->
  <rect x="120" y="165" width="140" height="55" rx="4" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
  <text x="190" y="186" text-anchor="middle" class="field-label">key</text>
  <text x="190" y="205" text-anchor="middle" class="value">"Alice"</text>

  <!-- value field (green) -->
  <rect x="260" y="165" width="90" height="55" rx="4" fill="#2ecc71" stroke="#27ae60" stroke-width="2"/>
  <text x="305" y="186" text-anchor="middle" class="field-label">value</text>
  <text x="305" y="205" text-anchor="middle" class="value">95</text>

  <!-- next field (orange) -->
  <rect x="350" y="165" width="90" height="55" rx="4" fill="#f39c12" stroke="#e67e22" stroke-width="2"/>
  <text x="395" y="186" text-anchor="middle" class="field-label">next</text>
  <text x="395" y="207" text-anchor="middle" class="value-sm">&#x2192;</text>

  <!-- Arrow to next node -->
  <line x1="440" y1="192" x2="500" y2="192" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Next node (partial) -->
  <rect x="502" y="175" width="90" height="35" rx="4" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1.5"/>
  <text x="547" y="197" text-anchor="middle" style="font-size: 12px; fill: #95a5a6; font-weight: bold;">next node</text>

  <!-- Type labels below -->
  <text x="190" y="238" text-anchor="middle" class="label">std::string</text>
  <text x="305" y="238" text-anchor="middle" class="label">int</text>
  <text x="395" y="238" text-anchor="middle" class="label">ChainNode*</text>

  <!-- Context labels below types -->
  <text x="190" y="255" text-anchor="middle" class="note">student name</text>
  <text x="305" y="255" text-anchor="middle" class="note">grade</text>
  <text x="395" y="255" text-anchor="middle" class="note">next in chain</text>

  <!-- ==================== Comparison with Module 4 ==================== -->
  <line x1="30" y1="262" x2="770" y2="262" stroke="#ddd" stroke-width="1" stroke-dasharray="6,4"/>

  <text x="30" y="286" class="step-label">Compare with singly linked list:</text>

  <!-- Module 4 Node (data | next) -->
  <text x="80" y="318" text-anchor="middle" class="label">Node</text>
  <rect x="120" y="302" width="80" height="35" rx="4" fill="#2ecc71" stroke="#27ae60" stroke-width="2"/>
  <rect x="200" y="302" width="70" height="35" rx="4" fill="#f39c12" stroke="#e67e22" stroke-width="2"/>
  <text x="160" y="324" text-anchor="middle" class="value-sm">data</text>
  <text x="235" y="324" text-anchor="middle" class="value-sm">next</text>

  <!-- Arrow between -->
  <text x="320" y="324" text-anchor="middle" class="label-bold" fill="#e74c3c">becomes</text>

  <!-- ChainNode (key | value | next) -->
  <text x="420" y="318" text-anchor="middle" class="label">ChainNode</text>
  <rect x="470" y="302" width="90" height="35" rx="4" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
  <rect x="560" y="302" width="60" height="35" rx="4" fill="#2ecc71" stroke="#27ae60" stroke-width="2"/>
  <rect x="620" y="302" width="60" height="35" rx="4" fill="#f39c12" stroke="#e67e22" stroke-width="2"/>
  <text x="515" y="324" text-anchor="middle" class="value-sm">key</text>
  <text x="590" y="324" text-anchor="middle" class="value-sm">value</text>
  <text x="650" y="324" text-anchor="middle" class="value-sm">next</text>

  <text x="400" y="362" text-anchor="middle" class="note">Same linked-list concept — data is now split into a key (for lookup) and a value (the stored result)</text>
</svg>
