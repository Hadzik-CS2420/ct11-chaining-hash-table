<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 458">
  <style>
    text { font-family: 'Segoe UI', Arial, sans-serif; }
    .title { font-size: 18px; font-weight: bold; fill: #1a1a1a; }
    .subtitle { font-size: 13px; fill: #555; }
    .bucket-idx { font-size: 12px; font-weight: bold; fill: #2c3e50; font-family: 'Consolas', monospace; }
    .value { font-size: 11px; font-weight: bold; fill: #fff; }
    .value-lg { font-size: 12px; font-weight: bold; fill: #fff; }
    .empty-label { font-size: 11px; fill: #999; font-style: italic; }
    .label { font-size: 12px; fill: #333; }
    .label-bold { font-size: 12px; font-weight: bold; fill: #333; }
    .code { font-size: 11px; fill: #2c3e50; font-family: 'Consolas', monospace; }
    .note { font-size: 11px; fill: #777; font-style: italic; }
    .hash-note { font-size: 11px; fill: #8e44ad; font-family: 'Consolas', monospace; }
    .step-num { font-size: 14px; font-weight: bold; fill: #fff; }
    .deleted { font-size: 11px; font-weight: bold; fill: #c0392b; }
  </style>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#e74c3c"/>
    </marker>
    <marker id="arr-g" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#bdc3c7"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2980b9"/>
    </marker>
  </defs>

  <!-- Title bar -->
  <rect x="0" y="0" width="580" height="52" fill="#eaf2f8"/>
  <text x="290" y="22" text-anchor="middle" class="title">remove() &#x2014; Case 1: Key at HEAD</text>
  <text x="290" y="42" text-anchor="middle" class="subtitle">prev == nullptr tells us the match is at the head &#x2014; update buckets_[index]</text>

  <text x="30" y="76" class="code">remove("Diana")</text>
  <text x="190" y="76" class="hash-note">hash("Diana") % 7 = 4</text>

  <!-- Step 1 -->
  <circle cx="42" cy="102" r="11" fill="#2980b9"/>
  <text x="42" y="107" text-anchor="middle" class="step-num">1</text>
  <text x="61" y="107" class="code">size_t index = hash(key);</text>
  <text x="280" y="107" class="note">&#x2192; index = 4</text>

  <!-- Step 2 -->
  <circle cx="42" cy="132" r="11" fill="#2980b9"/>
  <text x="42" y="137" text-anchor="middle" class="step-num">2</text>
  <text x="61" y="133" class="code">ChainNode* current = buckets_[index];</text>
  <text x="61" y="147" class="code">ChainNode* prev = nullptr;</text>

  <!-- Before -->
  <text x="30" y="170" class="label-bold">Before:</text>

  <!-- prev box — standalone variable, points nowhere -->
  <rect x="30" y="178" width="80" height="28" rx="4" fill="#f5eef8" stroke="#8e44ad" stroke-width="1.5"/>
  <text x="70" y="189" text-anchor="middle" class="code" fill="#8e44ad">prev</text>
  <text x="70" y="201" text-anchor="middle" class="empty-label">nullptr</text>

  <!-- current label with arrow pointing to Diana -->
  <text x="175" y="216" text-anchor="middle" class="code" fill="#2980b9">current</text>
  <line x1="175" y1="219" x2="175" y2="233" stroke="#2980b9" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Chain: [4] → Diana → Alice → nullptr -->
  <text x="37" y="252" class="bucket-idx">[4]</text>
  <rect x="57" y="237" width="55" height="25" rx="3" fill="#7f8c8d" stroke="#636e72" stroke-width="1.5"/>
  <text x="84" y="254" text-anchor="middle" class="value">&#x2192;</text>
  <line x1="112" y1="249" x2="142" y2="249" stroke="#e74c3c" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- Diana (to be removed) -->
  <rect x="145" y="237" width="60" height="25" rx="3" fill="#3498db" stroke="#c0392b" stroke-width="2.5"/>
  <rect x="205" y="237" width="28" height="25" rx="3" fill="#2ecc71" stroke="#c0392b" stroke-width="2"/>
  <text x="175" y="254" text-anchor="middle" class="value">Diana</text>
  <text x="219" y="254" text-anchor="middle" class="value-lg">78</text>
  <line x1="233" y1="249" x2="263" y2="249" stroke="#e74c3c" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- Alice -->
  <rect x="266" y="237" width="60" height="25" rx="3" fill="#3498db" stroke="#2980b9" stroke-width="1.5"/>
  <rect x="326" y="237" width="28" height="25" rx="3" fill="#2ecc71" stroke="#27ae60" stroke-width="1.5"/>
  <text x="296" y="254" text-anchor="middle" class="value">Alice</text>
  <text x="340" y="254" text-anchor="middle" class="value-lg">95</text>
  <line x1="354" y1="249" x2="384" y2="249" stroke="#bdc3c7" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="393" y="254" class="empty-label">nullptr</text>

  <text x="61" y="279" class="note">current&#x2192;key == "Diana" &#x2192; found! prev == nullptr &#x2192; head case</text>

  <!-- Step 3 -->
  <circle cx="42" cy="303" r="11" fill="#e67e22"/>
  <text x="42" y="308" text-anchor="middle" class="step-num">3</text>
  <text x="61" y="308" class="label-bold">Unlink head</text>

  <rect x="28" y="319" width="380" height="18" rx="3" fill="#fdf2e9"/>
  <text x="32" y="333" class="code">buckets_[index] = current&#x2192;next;   // bucket now points to Alice</text>

  <!-- Step 4 -->
  <circle cx="42" cy="359" r="11" fill="#c0392b"/>
  <text x="42" y="364" text-anchor="middle" class="step-num">4</text>
  <text x="61" y="364" class="code">delete current; --size_; return true;</text>

  <!-- After -->
  <text x="30" y="393" class="label-bold">After:</text>

  <text x="37" y="421" class="bucket-idx">[4]</text>
  <rect x="57" y="406" width="55" height="25" rx="3" fill="#7f8c8d" stroke="#e67e22" stroke-width="2.5"/>
  <text x="84" y="423" text-anchor="middle" class="value">&#x2192;</text>
  <line x1="112" y1="418" x2="142" y2="418" stroke="#e74c3c" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- Alice is now head -->
  <rect x="145" y="406" width="60" height="25" rx="3" fill="#3498db" stroke="#2980b9" stroke-width="1.5"/>
  <rect x="205" y="406" width="28" height="25" rx="3" fill="#2ecc71" stroke="#27ae60" stroke-width="1.5"/>
  <text x="175" y="423" text-anchor="middle" class="value">Alice</text>
  <text x="219" y="423" text-anchor="middle" class="value-lg">95</text>
  <line x1="233" y1="418" x2="263" y2="418" stroke="#bdc3c7" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="272" y="423" class="empty-label">nullptr</text>

  <text x="57" y="445" class="note">&#x2191; bucket updated (was Diana)</text>
  <text x="310" y="423" class="deleted">Diana deleted</text>
</svg>
