<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 465">
  <style>
    text { font-family: 'Segoe UI', Arial, sans-serif; }
    .title { font-size: 18px; font-weight: bold; fill: #1a1a1a; }
    .subtitle { font-size: 13px; fill: #555; }
    .bucket-idx { font-size: 12px; font-weight: bold; fill: #2c3e50; font-family: 'Consolas', monospace; }
    .value { font-size: 11px; font-weight: bold; fill: #fff; }
    .value-lg { font-size: 12px; font-weight: bold; fill: #fff; }
    .empty-label { font-size: 11px; fill: #999; font-style: italic; }
    .label { font-size: 12px; fill: #333; }
    .label-bold { font-size: 12px; font-weight: bold; fill: #333; }
    .code { font-size: 12px; fill: #2c3e50; font-family: 'Consolas', monospace; }
    .code-sm { font-size: 11px; fill: #2c3e50; font-family: 'Consolas', monospace; }
    .note { font-size: 11px; fill: #777; font-style: italic; }
    .step-num { font-size: 13px; font-weight: bold; fill: #fff; }
    .color-label { font-size: 12px; font-weight: bold; }
  </style>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#e74c3c"/>
    </marker>
    <marker id="arr-g" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#bdc3c7"/>
    </marker>
    <marker id="arr-grn" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Title bar -->
  <rect x="0" y="0" width="860" height="52" fill="#eaf2f8"/>
  <text x="430" y="22" text-anchor="middle" class="title">Prepend &#x2014; Breaking Down the One-Liner</text>
  <text x="430" y="42" text-anchor="middle" class="subtitle">One line of code creates the node, links it to the old head, and updates the bucket &#x2014; read right to left</text>

  <!-- ==================== Color-coded code line ==================== -->
  <rect x="30" y="68" width="800" height="36" rx="6" fill="#2c3e50"/>

  <!-- Color segments of the code -->
  <!-- buckets_[index] = (orange — overwrites bucket head) -->
  <rect x="38" y="73" width="140" height="24" rx="4" fill="#e67e22"/>
  <text x="108" y="90" text-anchor="middle" class="step-num">buckets_[index]</text>

  <text x="185" y="90" style="font-size: 14px; fill: #fff; font-weight: bold;"> = </text>

  <!-- new ChainNode( (purple — creates the node) -->
  <rect x="210" y="73" width="130" height="24" rx="4" fill="#8e44ad"/>
  <text x="275" y="90" text-anchor="middle" class="step-num">new ChainNode(</text>

  <!-- key, value, (blue — the data) -->
  <rect x="344" y="73" width="100" height="24" rx="4" fill="#2980b9"/>
  <text x="394" y="90" text-anchor="middle" class="step-num">key, value,</text>

  <!-- buckets_[index] (green — current head becomes next) -->
  <rect x="448" y="73" width="140" height="24" rx="4" fill="#27ae60"/>
  <text x="518" y="90" text-anchor="middle" class="step-num">buckets_[index]</text>

  <text x="594" y="90" style="font-size: 14px; fill: #fff; font-weight: bold;">);</text>

  <!-- ==================== Step-by-step breakdown ==================== -->
  <text x="430" y="125" text-anchor="middle" class="label-bold">Walk through the constructor call, then the assignment</text>

  <!-- Step 1: new ChainNode( (purple) -->
  <rect x="30" y="142" width="250" height="70" rx="6" fill="#f5eef8" stroke="#8e44ad" stroke-width="1.5"/>
  <circle cx="52" cy="163" r="11" fill="#8e44ad"/>
  <text x="52" y="168" text-anchor="middle" class="step-num">1</text>
  <text x="70" y="168" class="color-label" fill="#8e44ad">new ChainNode(</text>
  <text x="48" y="188" class="label">Allocate a new node on the heap</text>
  <text x="48" y="204" class="note">The constructor takes three arguments:</text>

  <!-- Step 2: key, value (blue) -->
  <rect x="300" y="142" width="250" height="70" rx="6" fill="#d6eaf8" stroke="#2980b9" stroke-width="1.5"/>
  <circle cx="322" cy="163" r="11" fill="#2980b9"/>
  <text x="322" y="168" text-anchor="middle" class="step-num">2</text>
  <text x="340" y="168" class="color-label" fill="#2980b9">key, value</text>
  <text x="318" y="188" class="code-sm">"Diana", 78</text>
  <text x="318" y="204" class="note">The data to store in this node</text>

  <!-- Step 3: buckets_[index] as next (green) -->
  <rect x="570" y="142" width="260" height="70" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/>
  <circle cx="592" cy="163" r="11" fill="#27ae60"/>
  <text x="592" y="168" text-anchor="middle" class="step-num">3</text>
  <text x="610" y="168" class="color-label" fill="#27ae60">buckets_[index]</text>
  <text x="588" y="188" class="label">Current head (Alice) becomes next</text>
  <text x="588" y="204" class="note">Diana.next = Alice &#x2014; links new node to old head</text>

  <!-- Step 4: Assignment (orange) -->
  <rect x="30" y="224" width="800" height="50" rx="6" fill="#fdf2e9" stroke="#e67e22" stroke-width="1.5"/>
  <circle cx="52" cy="245" r="11" fill="#e67e22"/>
  <text x="52" y="250" text-anchor="middle" class="step-num">4</text>
  <text x="70" y="250" class="color-label" fill="#e67e22">buckets_[index] = &#x2014; overwrite bucket head</text>
  <text x="48" y="266" class="code-sm">buckets_[4] = Diana*</text>
  <text x="230" y="266" class="note">&#x2014; the bucket now points to Diana, who points to Alice</text>

  <!-- ==================== Before / After visual ==================== -->
  <text x="30" y="306" class="label-bold">Before:</text>

  <!-- Before: bucket [4] → Alice → nullptr -->
  <text x="30" y="334" class="bucket-idx">[4]</text>
  <rect x="50" y="319" width="55" height="25" rx="3" fill="#7f8c8d" stroke="#636e72" stroke-width="1.5"/>
  <text x="77" y="336" text-anchor="middle" class="value">&#x2192;</text>
  <line x1="105" y1="331" x2="140" y2="331" stroke="#e74c3c" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- Alice node -->
  <rect x="143" y="319" width="60" height="25" rx="3" fill="#3498db" stroke="#2980b9" stroke-width="1.5"/>
  <rect x="203" y="319" width="28" height="25" rx="3" fill="#2ecc71" stroke="#27ae60" stroke-width="1.5"/>
  <rect x="231" y="319" width="25" height="25" rx="3" fill="#f39c12" stroke="#e67e22" stroke-width="1.5"/>
  <text x="173" y="336" text-anchor="middle" class="value">Alice</text>
  <text x="217" y="336" text-anchor="middle" class="value-lg">95</text>
  <line x1="256" y1="331" x2="286" y2="331" stroke="#bdc3c7" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="295" y="336" class="empty-label">nullptr</text>

  <text x="30" y="382" class="label-bold">After:</text>

  <!-- After: bucket [4] → Diana → Alice → nullptr -->
  <text x="30" y="410" class="bucket-idx">[4]</text>
  <rect x="50" y="395" width="55" height="25" rx="3" fill="#7f8c8d" stroke="#636e72" stroke-width="1.5"/>
  <text x="77" y="412" text-anchor="middle" class="value">&#x2192;</text>
  <line x1="105" y1="407" x2="140" y2="407" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-grn)"/>
  <!-- Diana node (NEW — green border) -->
  <rect x="143" y="395" width="60" height="25" rx="3" fill="#3498db" stroke="#27ae60" stroke-width="2.5"/>
  <rect x="203" y="395" width="28" height="25" rx="3" fill="#2ecc71" stroke="#27ae60" stroke-width="2"/>
  <rect x="231" y="395" width="25" height="25" rx="3" fill="#f39c12" stroke="#e67e22" stroke-width="1.5"/>
  <text x="173" y="412" text-anchor="middle" class="value">Diana</text>
  <text x="217" y="412" text-anchor="middle" class="value-lg">78</text>
  <line x1="256" y1="407" x2="286" y2="407" stroke="#e74c3c" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- Alice node -->
  <rect x="289" y="395" width="60" height="25" rx="3" fill="#3498db" stroke="#2980b9" stroke-width="1.5"/>
  <rect x="349" y="395" width="28" height="25" rx="3" fill="#2ecc71" stroke="#27ae60" stroke-width="1.5"/>
  <rect x="377" y="395" width="25" height="25" rx="3" fill="#f39c12" stroke="#e67e22" stroke-width="1.5"/>
  <text x="319" y="412" text-anchor="middle" class="value">Alice</text>
  <text x="363" y="412" text-anchor="middle" class="value-lg">95</text>
  <line x1="402" y1="407" x2="432" y2="407" stroke="#bdc3c7" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="441" y="412" class="empty-label">nullptr</text>

  <text x="143" y="434" class="new-node">&#x2191; new node (head)</text>
  <text x="289" y="434" class="note">&#x2191; was head, now second</text>

  <!-- Footer -->
  <rect x="0" y="450" width="860" height="15" fill="#eaf2f8"/>
</svg>
