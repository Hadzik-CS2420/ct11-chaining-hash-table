<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520">
  <style>
    text { font-family: 'Segoe UI', Arial, sans-serif; }
    .title { font-size: 18px; font-weight: bold; fill: #1a1a1a; }
    .subtitle { font-size: 13px; fill: #555; }
    .bucket-idx { font-size: 13px; font-weight: bold; fill: #333; font-family: 'Consolas', monospace; }
    .value { font-size: 12px; font-weight: bold; fill: #fff; }
    .value-lg { font-size: 13px; font-weight: bold; fill: #fff; }
    .field-label { font-size: 10px; font-weight: bold; fill: #fff; }
    .empty-label { font-size: 12px; fill: #999; font-style: italic; }
    .label { font-size: 13px; fill: #333; }
    .label-bold { font-size: 13px; font-weight: bold; fill: #333; }
    .code { font-size: 12px; fill: #2c3e50; font-family: 'Consolas', monospace; }
    .note { font-size: 11px; fill: #777; font-style: italic; }
    .hash-note { font-size: 11px; fill: #8e44ad; font-family: 'Consolas', monospace; }
    .collision { font-size: 12px; font-weight: bold; fill: #e74c3c; }
  </style>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e74c3c"/>
    </marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#bdc3c7"/>
    </marker>
  </defs>

  <text x="440" y="28" text-anchor="middle" class="title">ChainingHashTable — Bucket Array with Chains</text>
  <text x="440" y="48" text-anchor="middle" class="subtitle">Each bucket is a linked list. Collisions add to the chain at that index.</text>

  <!-- ==================== Bucket Array (left side) ==================== -->
  <text x="30" y="82" class="label-bold">buckets_</text>
  <text x="30" y="98" class="code">ChainNode** (capacity = 7)</text>

  <!-- Bucket [0] — empty -->
  <rect x="40" y="115" width="80" height="40" rx="3" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1.5"/>
  <text x="20" y="140" text-anchor="middle" class="bucket-idx">[0]</text>
  <text x="80" y="140" text-anchor="middle" class="empty-label">nullptr</text>

  <!-- Bucket [1] — empty -->
  <rect x="40" y="160" width="80" height="40" rx="3" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1.5"/>
  <text x="20" y="185" text-anchor="middle" class="bucket-idx">[1]</text>
  <text x="80" y="185" text-anchor="middle" class="empty-label">nullptr</text>

  <!-- Bucket [2] — Charlie -->
  <rect x="40" y="205" width="80" height="40" rx="3" fill="#7f8c8d" stroke="#636e72" stroke-width="2"/>
  <text x="20" y="230" text-anchor="middle" class="bucket-idx">[2]</text>
  <text x="80" y="230" text-anchor="middle" class="value">&#x2192;</text>
  <line x1="120" y1="225" x2="180" y2="225" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Bucket [3] — Bob -->
  <rect x="40" y="250" width="80" height="40" rx="3" fill="#7f8c8d" stroke="#636e72" stroke-width="2"/>
  <text x="20" y="275" text-anchor="middle" class="bucket-idx">[3]</text>
  <text x="80" y="275" text-anchor="middle" class="value">&#x2192;</text>
  <line x1="120" y1="270" x2="180" y2="270" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Bucket [4] — Diana → Alice (COLLISION!) -->
  <rect x="40" y="295" width="80" height="40" rx="3" fill="#7f8c8d" stroke="#e74c3c" stroke-width="2.5"/>
  <text x="20" y="320" text-anchor="middle" class="bucket-idx">[4]</text>
  <text x="80" y="320" text-anchor="middle" class="value">&#x2192;</text>
  <line x1="120" y1="315" x2="180" y2="315" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Bucket [5] — Eve -->
  <rect x="40" y="340" width="80" height="40" rx="3" fill="#7f8c8d" stroke="#636e72" stroke-width="2"/>
  <text x="20" y="365" text-anchor="middle" class="bucket-idx">[5]</text>
  <text x="80" y="365" text-anchor="middle" class="value">&#x2192;</text>
  <line x1="120" y1="360" x2="180" y2="360" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Bucket [6] — empty -->
  <rect x="40" y="385" width="80" height="40" rx="3" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1.5"/>
  <text x="20" y="410" text-anchor="middle" class="bucket-idx">[6]</text>
  <text x="80" y="410" text-anchor="middle" class="empty-label">nullptr</text>

  <!-- ==================== Chain Nodes (right side) ==================== -->

  <!-- Charlie node at bucket [2] -->
  <rect x="182" y="208" width="100" height="35" rx="4" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
  <rect x="282" y="208" width="45" height="35" rx="4" fill="#2ecc71" stroke="#27ae60" stroke-width="2"/>
  <rect x="327" y="208" width="45" height="35" rx="4" fill="#f39c12" stroke="#e67e22" stroke-width="2"/>
  <text x="232" y="230" text-anchor="middle" class="value">Charlie</text>
  <text x="304" y="230" text-anchor="middle" class="value-lg">91</text>
  <text x="350" y="230" text-anchor="middle" class="value">&#x2192;</text>
  <line x1="372" y1="225" x2="410" y2="225" stroke="#bdc3c7" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
  <text x="440" y="230" class="empty-label">nullptr</text>

  <!-- Bob node at bucket [3] -->
  <rect x="182" y="253" width="100" height="35" rx="4" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
  <rect x="282" y="253" width="45" height="35" rx="4" fill="#2ecc71" stroke="#27ae60" stroke-width="2"/>
  <rect x="327" y="253" width="45" height="35" rx="4" fill="#f39c12" stroke="#e67e22" stroke-width="2"/>
  <text x="232" y="275" text-anchor="middle" class="value">Bob</text>
  <text x="304" y="275" text-anchor="middle" class="value-lg">82</text>
  <text x="350" y="275" text-anchor="middle" class="value">&#x2192;</text>
  <line x1="372" y1="270" x2="410" y2="270" stroke="#bdc3c7" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
  <text x="440" y="275" class="empty-label">nullptr</text>

  <!-- Diana node at bucket [4] — head of collision chain -->
  <rect x="182" y="298" width="100" height="35" rx="4" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
  <rect x="282" y="298" width="45" height="35" rx="4" fill="#2ecc71" stroke="#27ae60" stroke-width="2"/>
  <rect x="327" y="298" width="45" height="35" rx="4" fill="#f39c12" stroke="#e67e22" stroke-width="2"/>
  <text x="232" y="320" text-anchor="middle" class="value">Diana</text>
  <text x="304" y="320" text-anchor="middle" class="value-lg">78</text>
  <text x="350" y="320" text-anchor="middle" class="value">&#x2192;</text>
  <line x1="372" y1="315" x2="420" y2="315" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Alice node at bucket [4] — tail of collision chain -->
  <rect x="422" y="298" width="100" height="35" rx="4" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
  <rect x="522" y="298" width="45" height="35" rx="4" fill="#2ecc71" stroke="#27ae60" stroke-width="2"/>
  <rect x="567" y="298" width="45" height="35" rx="4" fill="#f39c12" stroke="#e67e22" stroke-width="2"/>
  <text x="472" y="320" text-anchor="middle" class="value">Alice</text>
  <text x="544" y="320" text-anchor="middle" class="value-lg">95</text>
  <text x="590" y="320" text-anchor="middle" class="value">&#x2192;</text>
  <line x1="612" y1="315" x2="650" y2="315" stroke="#bdc3c7" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
  <text x="680" y="320" class="empty-label">nullptr</text>

  <!-- Eve node at bucket [5] -->
  <rect x="182" y="343" width="100" height="35" rx="4" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
  <rect x="282" y="343" width="45" height="35" rx="4" fill="#2ecc71" stroke="#27ae60" stroke-width="2"/>
  <rect x="327" y="343" width="45" height="35" rx="4" fill="#f39c12" stroke="#e67e22" stroke-width="2"/>
  <text x="232" y="365" text-anchor="middle" class="value">Eve</text>
  <text x="304" y="365" text-anchor="middle" class="value-lg">88</text>
  <text x="350" y="365" text-anchor="middle" class="value">&#x2192;</text>
  <line x1="372" y1="360" x2="410" y2="360" stroke="#bdc3c7" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
  <text x="440" y="365" class="empty-label">nullptr</text>

  <!-- ==================== Collision callout ==================== -->
  <rect x="500" y="115" width="350" height="95" rx="8" fill="#fdedec" stroke="#e74c3c" stroke-width="1.5"/>
  <text x="675" y="138" text-anchor="middle" class="collision">Collision at bucket [4]!</text>
  <text x="520" y="160" class="hash-note">hash("Alice") % 7 = 4</text>
  <text x="520" y="178" class="hash-note">hash("Diana") % 7 = 4</text>
  <text x="520" y="198" class="note">Both keys map to the same index.</text>
  <text x="520" y="212" class="note">Diana prepends to Alice's chain (like push_front).</text>
  <line x1="595" y1="210" x2="295" y2="295" stroke="#e74c3c" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- ==================== Legend ==================== -->
  <text x="30" y="465" class="label-bold">Legend:</text>
  <rect x="100" y="452" width="30" height="16" rx="3" fill="#7f8c8d"/>
  <text x="135" y="465" class="label">bucket (ChainNode*)</text>
  <rect x="290" y="452" width="30" height="16" rx="3" fill="#3498db"/>
  <text x="325" y="465" class="label">key</text>
  <rect x="370" y="452" width="30" height="16" rx="3" fill="#2ecc71"/>
  <text x="405" y="465" class="label">value</text>
  <rect x="450" y="452" width="30" height="16" rx="3" fill="#f39c12"/>
  <text x="485" y="465" class="label">next</text>

  <text x="440" y="500" text-anchor="middle" class="note">size_ = 5 &#x2022; capacity_ = 7 &#x2022; load_factor = 5/7 &#x2248; 0.71</text>
</svg>
